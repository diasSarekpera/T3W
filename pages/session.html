<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>T3W - Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/styles/pages/session/session.css" />
</head>
<body>

  <div class="shell">
    <div class="bg-glow" aria-hidden="true"></div>

    <!-- ══ HEADER ══ -->
    <header class="header">
      <a href="/pages/cartes.html" class="btn-nav" aria-label="Retour à la bibliothèque">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
        </svg>
        Retour
      </a>
      <div class="logo-block">
        <div class="logo-mark"><span>T</span>3<span>W</span></div>
        <div class="logo-tag">The 3 Words</div>
      </div>
      <!-- Mis à jour dynamiquement par session.js -->
      <button class="btn-lang" aria-label="Langue de la leçon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        Chargement…
      </button>
    </header>

    <!-- ══ HORIZON ══ -->
    <div class="horizon" aria-hidden="true">
      <div class="horizon-line"></div>
      <div class="horizon-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2-8 2 4.13 4.13 3 8 3 8-3.27-3.27-6.86-1.08-10 0z"/>
        </svg>
      </div>
      <div class="horizon-line"></div>
    </div>

    <!-- ══ SECTION LABEL — mis à jour par session.js ══ -->
    <div class="section-eyebrow" aria-live="polite">Les 3 mots du jour</div>

    <!-- ══ WORD CARDS — générées par session.js ══ -->
    <div class="words-stack" aria-live="polite" aria-label="Les 3 mots de la leçon">
      <!-- Squelettes de chargement -->
      <div class="word-card word-card--skeleton" aria-hidden="true"></div>
      <div class="word-card word-card--skeleton" aria-hidden="true"></div>
      <div class="word-card word-card--skeleton" aria-hidden="true"></div>
    </div>

    <!-- ══ PHRASE ══ -->
    <div class="phrase-wrap">
      <div class="phrase-card">
        <div class="phrase-top">
          <div class="phrase-eyebrow">Phrase du jour</div>
          <button class="btn-audio btn-audio-phrase" aria-label="Écouter la phrase">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
          </button>
        </div>
        <!-- Mis à jour dynamiquement par session.js -->
        <p class="phrase-text" aria-live="polite"></p>
        <div class="phrase-translation" aria-live="polite"></div>
        <div class="phrase-deco" aria-hidden="true">
          <svg viewBox="0 0 60 90" fill="currentColor">
            <path d="M30 5C30 5 55 20 55 50C55 75 30 85 30 85C30 85 5 75 5 50C5 20 30 5 30 5Z"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- ══ SONG CARD ══ -->
    <div class="song-wrap">
      <div class="song-card">
        <div class="song-glow" aria-hidden="true"></div>
        <div class="song-inner">
          <div class="song-top">
            <div class="song-meta">
              <div class="song-eyebrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 18V5l12-2v13"/>
                  <circle cx="6" cy="18" r="3"/>
                  <circle cx="18" cy="16" r="3"/>
                </svg>
                <span class="song-eyebrow-text">Chanson du jour</span>
              </div>
              <!-- Mis à jour dynamiquement par session.js -->
              <div class="song-title-text" aria-live="polite">Chargement…</div>
              <div class="song-subtitle" aria-live="polite"></div>
            </div>
            <button class="btn-play-main" aria-label="Jouer la chanson" id="playBtn">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5,3 19,12 5,21"/>
              </svg>
            </button>
          </div>
          <div class="waveform" aria-hidden="true" id="wf"></div>
        </div>
      </div>
    </div>

    <!-- ══ FOOTER ══ -->
    <footer class="footer">
      <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" aria-hidden="true">
        <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2-8 2 4.13 4.13 3 8 3 8-3.27-3.27-6.86-1.08-10 0z"/>
      </svg>
      <p class="footer-text"><strong>T3W</strong> · Apprends 3 mots, à la fois.</p>
    </footer>

  </div><!-- /.shell -->

  <!-- Scripts : registre → utilitaires → page -->
  <script src="/assets/languages/registry.js"></script>
  <script src="/scripts/lessons.js"></script>
  <script src="/scripts/session.js"></script>

</body>
</html>
